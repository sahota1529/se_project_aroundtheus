<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around the U.S</title>
    <link rel="shortcut icon" href="favicon.ico" />
  </head>

  <body class="page">
    <div class="page__content">
      <!--Header-->

      <header class="header">
        <img
          src="<%=require(`./images/Logo.svg`)%>"
          alt="Around the U.S. Logo"
          class="header__image"
        />
      </header>
      <main class="content">
        <!--PROFILE SECTION-->

        <section class="profile">
          <div class="profile__image-container">
            <img
              src=""
              alt="Profile Image"
              class="profile__image"
              id="profile-avatar-image"
            />
            <img
              class="profile__pencil"
              src="<%=require('./images/pencil-vector.svg')%>"
              alt="Profile Pencil Logo"
              id="profile-pencil"
            />
          </div>

          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <button
              class="profile__edit-button"
              id="profile-edit-button"
              type="button"
            ></button>
            <p class="profile__subtitle"></p>
          </div>
          <button
            class="profile__add-button"
            type="button"
            id="add-card-button"
          >
            <img
              src="<%=require('./images/Close Icon.svg')%>"
              class="profile__add-button-image"
              alt="Profile Add Button Icon"
            />
          </button>
        </section>

        <!--GALLERY CARDS-->

        <section class="cards">
          <ul class="cards__list"></ul>
        </section>
      </main>

      <!--FOOTER-->

      <footer class="footer">
        <p class="footer__text">&copy; 2024 Around The U.S.</p>
      </footer>
    </div>

    <!--Edit modal-->

    <div class="modal" id="profile-edit-modal">
      <div class="modal__container">
        <button
          class="modal__close-button"
          id="profile-close-button"
          type="button"
        ></button>
        <p class="modal__heading">Edit Profile</p>
        <form class="modal__form" name="profile-form" id="modal-form">
          <fieldset class="modal__form-fieldset">
            <input
              type="text"
              name="name"
              class="modal__form-input"
              placeholder=" Your Name"
              id="profile-title-input"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="modal__error" id="profile-title-input-error"></span>
            <input
              type="text"
              name="description"
              class="modal__form-input"
              placeholder="About me"
              id="profile-subtitle-input"
              minlength="2"
              maxlength="200"
              required
            />
            <span class="modal__error" id="profile-subtitle-input-error"></span>
            <button class="modal__save-button" type="submit">Save</button>
          </fieldset>
        </form>
      </div>
    </div>

    <!--Add card modal-->

    <div class="modal" id="add-card-modal">
      <div class="modal__container">
        <button
          class="modal__close-button"
          id="add-card-close-button"
          type="button"
        ></button>
        <p class="modal__heading">New Place</p>
        <form class="modal__form" id="add-card-form">
          <fieldset class="modal__form-fieldset">
            <input
              type="text"
              name="title"
              class="modal__form-input"
              placeholder="Title"
              id="card-title-input"
              maxlength="30"
              minlength="1"
              required
            />
            <span class="modal__error" id="card-title-input-error"></span>

            <input
              type="url"
              name="subtitle"
              class="modal__form-input"
              placeholder="Image URL"
              id="modal-url-input"
              required
            />
            <span class="modal__error" id="modal-url-input-error"></span>
            <button
              class="modal__save-button modal__save-button_disabled"
              type="submit"
              id="card-save-button"
              disabled
            >
              Save
            </button>
          </fieldset>
        </form>
      </div>
    </div>

    <!--Delete Confirm Modal-->

    <div class="modal" id="delete-popup">
      <div class="modal__container">
        <button
          class="modal__close-button"
          type="button"
          id="add-card-close-button"
        ></button>
        <form class="modal__form" id="confirm-form">
          <p class="modal__yes-heading">Are you sure?</p>
          <button class="modal__save-button" id="confirm-button">Yes</button>
        </form>
      </div>
    </div>

    <!--Profile Picture Edit Modal-->

    <div class="modal" id="profile-image-modal">
      <div class="modal__container">
        <button class="modal__close-button" type="button"></button>
        <p class="modal__heading">Change profile picture</p>
        <form class="modal__form" id="image-edit-form">
          <fieldset class="modal__form-fieldset">
            <input
              type="url"
              name="link"
              id="modal-url-input"
              class="modal__form-input"
              placeholder="Image URL"
              required
            />
            <span class="modal__error" id="modal-url-input-error"></span>
            <button
              class="modal__save-button modal__save-button_disabled"
              type="submit"
            >
              Save
            </button>
          </fieldset>
        </form>
      </div>
    </div>

    <!--Preview Image Modal-->

    <div class="modal" id="preview-modal">
      <div class="modal__preview-container">
        <button
          type="button"
          class="modal__close-button"
          id="preview-close-button"
        ></button>
        <img class="modal__image" src="#" alt="" id="modal-image" />
        <p class="modal__caption"></p>
      </div>
    </div>

    <!--Card Template-->

    <template id="card-template">
      <li class="card">
        <button
          class="card__trash-button"
          type="button"
          id="trash-button"
        ></button>
        <img class="card__image" src="" alt="" />
        <div class="card__description">
          <h2 class="card__description-text"></h2>

          <button
            class="card__like-button"
            type="button"
            id="card-like-button"
          ></button>
        </div>
      </li>
    </template>
  </body>
</html>
